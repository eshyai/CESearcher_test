server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。配合下面 proxy_pass 用变量，实现「运行时解析」：
    # 1) 后端容器没起来时 nginx 也能正常启动（否则启动就报 host not found in upstream）；
    # 2) 后端容器重建换了 IP 后，10 秒内自动重新解析，不会一直 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend "http://backend:8200";

    # 采集上传/附件接口可能传大文件
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 前缀，与 frontend/vite.config.ts 的 proxy 列表保持一致。
    #
    # 注意：/chat、/news、/database、/topics(无冲突) 等既是后端前缀，
    # 也是前端页面路由。判定方式与 vite 的 bypass 一致——
    # 浏览器地址栏访问/刷新页面时 Accept 含 text/html，交回 SPA 兜底；
    # axios 接口请求 Accept 为 application/json，正常转发后端。
    location ~ ^/(auth|sessions|attachments|chat|database|documents|intelligence|knowledge-bases|memories|news|research|search|hello)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        # 用变量形式转发，请求 URI 需显式拼上
        proxy_pass $upstream_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式输出（/chat、/research）必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 同步采集管道实测约 3 分钟；资讯检索含全网实时调用
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # SPA 兜底：其余路径一律返回 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
